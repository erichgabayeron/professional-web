<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | WEBSRICH</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <h1>WEBSRICH</h1>
        <p class="sub">WEB DESIGNER</p>
      </div>

      <nav class="main-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="design.html" class="nav-link">Designs</a>
        <a href="contact.html" class="nav-link current">Contact</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="left">
        <h1>Get in Touch</h1>
        <h3>I’d like to hear from you!</h3>
        <p>
            If you have any inquiries or just want to say hi,  
            please use the contact form!
        </p>

        <div class="email">
            <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" class="icon">
            <a href="google.com">erich.g@gmail.com</a>
        </div>

        <div class="socials">
            <img class="sicon" src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png">
            <img class="sicon" src="https://cdn-icons-png.flaticon.com/512/1384/1384031.png">
            <img class="sicon" src="https://cdn-icons-png.flaticon.com/512/1384/1384014.png">
            <img class="sicon" src="https://cdn-icons-png.flaticon.com/512/1384/1384049.png">
            <img class="sicon" src="https://cdn-icons-png.flaticon.com/512/1384/1384044.png">
        </div>
    </div>
    <div class="right">
        <form id="contactForm">
            <div class="row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input type="text">
                </div>
            </div>

            <label>Email *</label>
            <input type="email" required>

            <label>Message</label>
            <textarea></textarea>

            <button type="submit">Send</button>
        </form>
    </div>
  </div>

  <script>
      document.getElementById("contactForm").addEventListener("submit", function(event) {
          event.preventDefault();
          alert("Message was sent");
          this.reset();
      });
  </script>

  <footer class="site-footer">
    <p>WEBSRICH • Designed by Erich Gabayeron</p>
  </footer>
</body>
</html>
